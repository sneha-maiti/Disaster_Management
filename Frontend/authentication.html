<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER-X // Authorization Required</title>

    <!-- Fonts: kept consistent with the rest of the AETHER-X frontend -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Orbitron:wght@600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --void: #040611;
            --panel: rgba(10, 18, 36, 0.62);
            --panel-solid: #0a1224;
            --edge: rgba(96, 165, 250, 0.22);
            --edge-bright: rgba(96, 165, 250, 0.55);
            --blue-900: #0b1b3f;
            --blue-700: #1d4ed8;
            --blue-500: #3b82f6;
            --blue-400: #60a5fa;
            --blue-300: #93c5fd;
            --sky-400: #38bdf8;
            --text: #dbe7ff;
            --text-dim: #6b7fa3;
            --danger: #ff4d5e;
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            background: var(--void);
            overflow: hidden;
            font-family: var(--font-body);
            color: var(--text);
        }

        /* ===================== BACKDROP ===================== */

        .scanfield {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 90% 60% at 50% 0%, rgba(29, 78, 216, 0.22), transparent 60%),
                radial-gradient(ellipse 70% 50% at 85% 100%, rgba(56, 189, 248, 0.10), transparent 60%),
                var(--void);
        }

        .grid-layer {
            position: absolute;
            inset: -2px;
            background-image:
                linear-gradient(rgba(96, 165, 250, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(96, 165, 250, 0.08) 1px, transparent 1px);
            background-size: 42px 42px;
            -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 45%, black 10%, transparent 75%);
            mask-image: radial-gradient(ellipse 70% 70% at 50% 45%, black 10%, transparent 75%);
            animation: driftGrid 24s linear infinite;
        }

        @keyframes driftGrid {
            from {
                background-position: 0 0, 0 0;
            }

            to {
                background-position: 84px 84px, 84px 84px;
            }
        }

        .scanline {
            position: absolute;
            left: 0;
            right: 0;
            height: 140px;
            background: linear-gradient(to bottom, transparent, rgba(96, 165, 250, 0.10) 45%, rgba(147, 197, 253, 0.22) 50%, rgba(96, 165, 250, 0.10) 55%, transparent);
            mix-blend-mode: screen;
            animation: sweepDown 6.5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes sweepDown {
            0% {
                top: -140px;
            }

            50% {
                top: 100%;
            }

            50.01% {
                top: -140px;
            }

            100% {
                top: -140px;
            }
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.55;
            animation: floatOrb 14s ease-in-out infinite;
        }

        .orb1 {
            width: 420px;
            height: 420px;
            left: -120px;
            top: -140px;
            background: radial-gradient(circle, var(--blue-700), transparent 70%);
            animation-delay: 0s;
        }

        .orb2 {
            width: 360px;
            height: 360px;
            right: -100px;
            bottom: -120px;
            background: radial-gradient(circle, var(--sky-400), transparent 70%);
            animation-delay: -6s;
        }

        @keyframes floatOrb {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(30px, -24px) scale(1.08);
            }
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: var(--blue-300);
            box-shadow: 0 0 6px 1px var(--blue-400);
            animation: rise linear infinite;
            opacity: 0;
        }

        @keyframes rise {
            0% {
                transform: translateY(0);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            90% {
                opacity: 0.3;
            }

            100% {
                transform: translateY(-100vh);
                opacity: 0;
            }
        }

        .vignette {
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 220px 60px #040611;
            pointer-events: none;
        }

        /* ===================== SHELL ===================== */

        .auth-shell {
            position: relative;
            z-index: 2;
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-card {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 40px 36px 32px;
            background: var(--panel);
            border: 1px solid var(--edge);
            border-radius: 18px;
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            box-shadow:
                0 0 0 1px rgba(96, 165, 250, 0.05),
                0 30px 80px -20px rgba(2, 8, 23, 0.9),
                0 0 60px -15px rgba(59, 130, 246, 0.35);
            animation: cardIn 0.9s cubic-bezier(.19, 1, .22, 1) both;
            transition: transform .25s ease, box-shadow .25s ease;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .auth-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 18px;
            padding: 1px;
            background: linear-gradient(135deg, var(--edge-bright), transparent 30%, transparent 70%, var(--edge-bright));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.6;
            pointer-events: none;
        }

        .auth-card.shake {
            animation: shakeCard 0.5s ease;
        }

        @keyframes shakeCard {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-10px);
            }

            40% {
                transform: translateX(8px);
            }

            60% {
                transform: translateX(-6px);
            }

            80% {
                transform: translateX(4px);
            }
        }

        .auth-card.granted {
            box-shadow:
                0 0 0 1px rgba(96, 165, 250, 0.1),
                0 30px 80px -20px rgba(2, 8, 23, 0.9),
                0 0 90px 0 rgba(56, 189, 248, 0.55);
        }

        /* ===================== BRAND / RING ===================== */

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand-ring {
            width: 74px;
            height: 74px;
            margin: 0 auto 16px;
            position: relative;
        }

        .brand-ring svg {
            width: 100%;
            height: 100%;
        }

        .ring-outer {
            stroke: var(--blue-500);
            stroke-width: 1.4;
            fill: none;
            opacity: 0.55;
            animation: spinSlow 10s linear infinite;
            transform-origin: 50% 50%;
        }

        .ring-inner {
            stroke: var(--sky-400);
            stroke-width: 1.4;
            fill: none;
            stroke-dasharray: 6 10;
            opacity: 0.8;
            animation: spinSlow 7s linear infinite reverse;
            transform-origin: 50% 50%;
        }

        @keyframes spinSlow {
            to {
                transform: rotate(360deg);
            }
        }

        .brand-core {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-core svg {
            width: 26px;
            height: 26px;
        }

        .brand-core path {
            stroke: var(--blue-300);
        }

        .brand-core .pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(96, 165, 250, 0.5);
            animation: pulseRing 2.4s ease-out infinite;
        }

        @keyframes pulseRing {
            0% {
                box-shadow: 0 0 0 0 rgba(96, 165, 250, 0.45);
            }

            70% {
                box-shadow: 0 0 0 16px rgba(96, 165, 250, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(96, 165, 250, 0);
            }
        }

        h1 {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.9rem;
            letter-spacing: 2px;
            color: #eef4ff;
            text-shadow: 0 0 22px rgba(96, 165, 250, 0.55);
        }

        h1 span {
            color: var(--sky-400);
        }

        .tagline {
            margin-top: 6px;
            font-family: var(--font-mono);
            font-size: 0.66rem;
            letter-spacing: 3px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        /* ===================== STATUS LINE ===================== */

        .status-line {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            letter-spacing: 1.2px;
            text-align: center;
            color: var(--blue-300);
            padding: 9px 10px;
            margin-bottom: 20px;
            border: 1px solid var(--edge);
            border-radius: 8px;
            background: rgba(59, 130, 246, 0.06);
            min-height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color .3s ease, border-color .3s ease, background .3s ease;
        }

        .status-line.err {
            color: var(--danger);
            border-color: rgba(255, 77, 94, 0.4);
            background: rgba(255, 77, 94, 0.08);
        }

        .status-line.ok {
            color: var(--sky-400);
            border-color: rgba(56, 189, 248, 0.5);
            background: rgba(56, 189, 248, 0.1);
        }

        /* ===================== FORM ===================== */

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        label {
            display: block;
            font-family: var(--font-mono);
            font-size: 0.64rem;
            letter-spacing: 2px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            background: rgba(4, 8, 20, 0.65);
            border: 1px solid var(--edge);
            border-radius: 9px;
            padding: 12px 14px;
            color: var(--text);
            font-family: var(--font-body);
            font-size: 0.92rem;
            outline: none;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
        }

        input::placeholder {
            color: #3f537a;
        }

        input:focus {
            border-color: var(--blue-400);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
            background: rgba(8, 14, 30, 0.85);
        }

        .pw-wrap {
            position: relative;
        }

        .pw-wrap input {
            padding-right: 42px;
        }

        .pw-toggle {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            transition: color .2s ease, background .2s ease;
        }

        .pw-toggle:hover {
            color: var(--blue-300);
            background: rgba(96, 165, 250, 0.08);
        }

        .pw-toggle svg {
            width: 17px;
            height: 17px;
        }

        /* ===================== SUBMIT BUTTON ===================== */

        button[type="submit"] {
            position: relative;
            margin-top: 6px;
            padding: 13px 18px;
            border: 1px solid var(--edge-bright);
            border-radius: 9px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.18), rgba(56, 189, 248, 0.10));
            color: #eaf2ff;
            font-family: var(--font-mono);
            font-size: 0.76rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            overflow: hidden;
            transition: transform .15s ease, box-shadow .25s ease, border-color .25s ease;
        }

        button[type="submit"]:hover {
            box-shadow: 0 0 24px rgba(59, 130, 246, 0.4);
            transform: translateY(-1px);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        button[type="submit"]:disabled {
            cursor: progress;
            opacity: 0.85;
        }

        .btn-fill {
            position: absolute;
            inset: 0;
            left: 0;
            width: 0%;
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.35), rgba(56, 189, 248, 0.5));
            transition: width 1.1s cubic-bezier(.4, 0, .2, 1);
            z-index: 0;
        }

        .btn-label {
            position: relative;
            z-index: 1;
        }

        /* ===================== FOOTNOTE ===================== */

        .footnote {
            margin-top: 20px;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 1.5px;
            color: #3f537a;
        }

        .footnote span {
            color: var(--blue-400);
        }

        @media (max-width:480px) {
            .auth-card {
                padding: 32px 22px 26px;
            }

            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>

    <div class="scanfield">
        <div class="grid-layer"></div>
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="scanline"></div>
        <div id="particles"></div>
        <div class="vignette"></div>
    </div>

    <main class="auth-shell">
        <div class="auth-card" id="authCard">

            <div class="brand">
                <div class="brand-ring">
                    <svg viewBox="0 0 74 74">
                        <polygon class="ring-outer" points="37,4 66,20.5 66,53.5 37,70 8,53.5 8,20.5"></polygon>
                        <circle class="ring-inner" cx="37" cy="37" r="26"></circle>
                    </svg>
                    <div class="brand-core">
                        <div class="pulse"></div>
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M12 2 L20 6 V12 C20 17 16.5 20.5 12 22 C7.5 20.5 4 17 4 12 V6 Z"></path>
                            <path d="M9 12 L11 14 L15.5 9.5"></path>
                        </svg>
                    </div>
                </div>
                <h1>AETHER<span>-X</span></h1>
                <p class="tagline">Tactical Core · Authorization Required</p>
            </div>

            <div class="status-line" id="statusLine">SYSTEM STANDBY — AWAITING CREDENTIALS</div>

            <form id="authForm" autocomplete="off">
                <div>
                    <label for="username">Operator ID</label>
                    <input type="text" id="username" name="username" placeholder="e.g. admin" required>
                </div>

                <div>
                    <label for="password">Access Key</label>
                    <div class="pw-wrap">
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submitBtn">
                    <span class="btn-fill" id="btnFill"></span>
                    <span class="btn-label" id="btnLabel">Authenticate</span>
                </button>
            </form>

            <div class="footnote">ENCRYPTED CHANNEL · NODE 07 · <span id="clock">--:--:-- UTC</span></div>

        </div>
    </main>

    <script>
        /* ==========================================================================
           AETHER-X — AUTHORIZATION GATE
           Talks to the existing FastAPI backend: POST /api/auth/login
           Body:  { "username": "...", "password": "..." }
           Reply: { "success": bool, "message": string, "role"?: string }
           ========================================================================== */

        // ---- CONFIG: point this at your running backend ----
        const API_BASE = window.API_BASE || "https://disaster-management-backend-umtb.onrender.com";
        const LOGIN_ENDPOINT = API_BASE + "/api/auth/login";
        const REDIRECT_ON_SUCCESS = "index.html";
        // ------------------------------------------------------

        const form = document.getElementById('authForm');
        const statusLine = document.getElementById('statusLine');
        const submitBtn = document.getElementById('submitBtn');
        const btnFill = document.getElementById('btnFill');
        const btnLabel = document.getElementById('btnLabel');
        const authCard = document.getElementById('authCard');
        const pwInput = document.getElementById('password');
        const pwToggle = document.getElementById('pwToggle');

        // If already authenticated this session, skip straight through.
        if (sessionStorage.getItem('aetherx_auth')) {
            window.location.replace(REDIRECT_ON_SUCCESS);
        }

        // Password visibility toggle
        pwToggle.addEventListener('click', () => {
            pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
            pwToggle.style.color = pwInput.type === 'text' ? 'var(--blue-300)' : '';
        });

        function setStatus(text, mode) {
            statusLine.textContent = text;
            statusLine.classList.remove('err', 'ok');
            if (mode) statusLine.classList.add(mode);
        }

        // Cycles verification messages while the request is in flight for a premium feel
        function cycleVerifying() {
            const msgs = [
                'VERIFYING CREDENTIALS…',
                'CROSS-REFERENCING DATABASE…',
                'ESTABLISHING SECURE CHANNEL…'
            ];
            let i = 0;
            setStatus(msgs[0]);
            return setInterval(() => {
                i = (i + 1) % msgs.length;
                setStatus(msgs[i]);
            }, 650);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = pwInput.value;

            submitBtn.disabled = true;
            btnLabel.textContent = 'Authenticating';
            btnFill.style.width = '100%';
            const interval = cycleVerifying();

            try {
                const res = await fetch(LOGIN_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                clearInterval(interval);

                if (res.ok && data.success) {
                    sessionStorage.setItem('aetherx_auth', JSON.stringify({
                        username, role: data.role || 'USER', ts: Date.now()
                    }));
                    setStatus('ACCESS GRANTED — WELCOME, ' + username.toUpperCase(), 'ok');
                    authCard.classList.add('granted');
                    btnLabel.textContent = 'Access Granted';
                    setTimeout(() => { window.location.href = REDIRECT_ON_SUCCESS; }, 900);
                } else {
                    throw new Error(data.message || 'Invalid credentials');
                }
            } catch (err) {
                clearInterval(interval);
                const offline = err instanceof TypeError; // fetch network failure

                // If offline / backend not running, allow default admin credentials
                if (offline && username.toLowerCase() === 'admin' && password === 'admin123') {
                    sessionStorage.setItem('aetherx_auth', JSON.stringify({
                        username: 'admin', role: 'ADMIN', ts: Date.now(), mode: 'local_override'
                    }));
                    setStatus('OFFLINE OVERRIDE GRANTED — WELCOME, ADMIN', 'ok');
                    authCard.classList.add('granted');
                    btnLabel.textContent = 'Access Granted';
                    setTimeout(() => { window.location.href = REDIRECT_ON_SUCCESS; }, 900);
                    return;
                }

                btnFill.style.width = '0%';
                btnLabel.textContent = 'Authenticate';
                submitBtn.disabled = false;
                authCard.classList.add('shake');
                setTimeout(() => authCard.classList.remove('shake'), 500);

                setStatus(offline
                    ? 'CONNECTION TO CORE FAILED — START BACKEND (OR USE ADMIN/ADMIN123)'
                    : (err.message || 'ACCESS DENIED — INVALID CREDENTIALS'), 'err');
                pwInput.value = '';
                pwInput.focus();
            }
        });

        // Ambient rising particles
        (function initParticles() {
            const host = document.getElementById('particles');
            const count = 26;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.bottom = -10 + 'px';
                p.style.animationDuration = (10 + Math.random() * 14) + 's';
                p.style.animationDelay = (Math.random() * 14) + 's';
                host.appendChild(p);
            }
        })();

        // UTC clock in footer
        function tickClock() {
            const el = document.getElementById('clock');
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            el.textContent = pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds()) + ' UTC';
        }
        tickClock();
        setInterval(tickClock, 1000);
    </script>

</body>

</html>
